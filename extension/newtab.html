<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>New Tab</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png">
  <link rel="stylesheet" href="newtab.css">
  <script src="theme.js"></script>
</head>
<body>
  <main class="page" id="app" aria-busy="true">
    <header class="masthead">
      <div class="masthead-inner">
      <div class="titles-block">
        <h1 class="headline" id="headline">&nbsp;</h1>
        <p class="lede" id="lede">&nbsp;</p>
      </div>
      <div class="tools" id="tools">
      <div class="seg tab-switch" id="tab-switch" role="tablist" aria-label="View" hidden>
        <button class="seg-btn tab-btn" role="tab" data-tab="projects" aria-selected="true">Projects</button>
        <button class="seg-btn tab-btn" role="tab" data-tab="bookmarks" aria-selected="false">Bookmarks</button>
      </div>
      <div class="seg view-toggle" id="view-toggle" role="group" aria-label="Layout" hidden>
        <button class="seg-btn view-btn" data-view="grid" aria-pressed="true" aria-label="Grid view" data-tip="Grid"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
        <button class="seg-btn view-btn" data-view="list" aria-pressed="false" aria-label="List view" data-tip="List"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></button>
      </div>
      <label class="search" id="search" hidden>
        <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="m10.5 10.5 3.25 3.25"/></svg>
        <input id="query" type="text" placeholder="Search projects" autocomplete="off" spellcheck="false" aria-label="Search projects">
        <kbd class="search-key" aria-hidden="true">/</kbd>
      </label>
      <button class="icon-btn settings-btn" id="settings-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings" aria-label="Settings" data-tip="Settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span class="badge-dot" id="settings-badge" hidden></span></button>
      </div>
      </div>
    </header>

    <div class="board">
      <div class="board-inner">

    <section class="section" id="section-pinned" hidden>
      <h2 class="section-label"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>Pinned <span class="section-count" id="count-pinned"></span></h2>
      <ul class="grid" id="grid-pinned"></ul>
    </section>

    <section class="section" id="section-running" hidden>
      <h2 class="section-label"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>Running <span class="section-count" id="count-running"></span></h2>
      <ul class="grid" id="grid-running"></ul>
    </section>

    <section class="section" id="section-services" hidden>
      <h2 class="section-label"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01"/><path d="M6 17h.01"/></svg>Services <span class="section-count" id="count-services"></span></h2>
      <ul class="grid" id="grid-services"></ul>
    </section>

    <section class="section" id="section-recent" hidden>
      <h2 class="section-label">Recent <span class="section-count" id="count-recent"></span></h2>
      <ul class="grid" id="grid-recent"></ul>
    </section>

    <div class="empty" id="empty" hidden><p class="empty-text" id="empty-text"></p><button class="btn btn-ghost" id="empty-settings" hidden>Open settings</button></div>

    <section class="setup" id="setup" hidden>
      <p class="setup-text">The new tab needs a small helper on your Mac to read ports and start or stop projects. Paste this in Terminal once, then reload this tab. It needs Node.js 18 or newer.</p>
      <code class="setup-command" id="setup-command"></code>
      <div class="setup-actions">
        <button class="btn btn-filled" id="copy-setup">Copy command</button>
        <button class="btn btn-ghost" id="retry-setup">Reload</button>
      </div>
      <p class="setup-error" id="setup-error"></p>
    </section>
      </div>
    </div>
  </main>

  <div class="settings" id="settings" role="dialog" aria-label="Settings" hidden>
    <div class="settings-group">
      <div class="settings-label">Theme</div>
      <div class="seg theme-toggle" role="group" aria-label="Theme">
        <button class="seg-btn theme-btn" data-theme-choice="auto" aria-pressed="true">Auto</button>
        <button class="seg-btn theme-btn" data-theme-choice="light" aria-pressed="false">Light</button>
        <button class="seg-btn theme-btn" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
    <div class="settings-group">
      <div class="settings-label">Extras</div>
      <label class="switch-row"><span>Most visited sites</span><input type="checkbox" role="switch" data-section="mostVisited"></label>
      <label class="switch-row"><span>Bookmarks tab</span><input type="checkbox" role="switch" data-section="bookmarks"></label>
      <button class="link-btn" id="unhide-sites" hidden>Show hidden sites again</button>
    </div>
    <div class="settings-group">
      <div class="settings-label">Projects</div>
      <label class="switch-row"><span>Pinned</span><input type="checkbox" role="switch" data-section="pinned"></label>
      <label class="switch-row"><span>Running</span><input type="checkbox" role="switch" data-section="running"></label>
      <label class="switch-row"><span>Services</span><input type="checkbox" role="switch" data-section="services"></label>
      <label class="switch-row"><span>Recent</span><input type="checkbox" role="switch" data-section="recent"></label>
    </div>
  </div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
